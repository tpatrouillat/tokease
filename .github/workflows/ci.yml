name: CI

# When to run: on every Pull Request, and on every push to main
on:
  pull_request:
  push:
    branches: [main]

# The CI only reads the repo; keep the GITHUB_TOKEN read-only
permissions:
  contents: read

# Cancel the previous run when you push again quickly on the same branch (saves minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: an unpinned ruff broke the CI when 0.16 landed with new default rules
      - run: pip install "ruff==0.15.22"
      - run: ruff check .
      # Uncomment this gate AFTER running `ruff format .` once
      # - run: ruff format --check .

  test:
    name: Test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false           # one failing version does not cancel the others
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest Pillow   # rumps is mocked in the tests, no need to install it
      - run: python -m pytest -q
