version: 2
updates:
  # Updates the Python deps (rumps / Pillow) declared in requirements.txt + setup.py
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:                 # regroupe minor+patch en UNE PR au lieu de plusieurs
        update-types: [minor, patch]
  # Updates the actions themselves (checkout, setup-python...)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
