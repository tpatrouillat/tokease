# Ruff config shared between local runs (uvx ruff) and CI, same rules everywhere
[tool.ruff]
target-version = "py310"                                  # targets Python 3.10+, see README
extend-exclude = ["assets", "graphify-out", "docs", "venv"]  # scripts and artifacts, not source code

[tool.ruff.lint]
extend-select = ["S"]                 # keep the ruff defaults and add S, flake8-bandit for security
ignore = ["S603", "S607"]            # subprocess with controlled input (osascript, `claude`), reviewed as safe

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]   # asserts and dummy tokens are expected in tests
